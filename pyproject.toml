[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-fraudnet-reproduction"
version = "0.1.0"
description = "Companion implementation of VR-FraudNet (Discover Artificial Intelligence 6:1403, 2026): follow one transaction through the five stages, audit why a rationale passed or failed, and rerun the paper's evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Partha Chakraborty" }]
maintainers = [{ name = "Partha Chakraborty" }]
keywords = ["fraud-detection", "verifiable-ai", "conformal-prediction", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
# Core is CPU-only and light: the verifier, schema, retrieval, calibration, metrics, statistics,
# audit and the synthetic walkthrough need nothing beyond these.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
trees = ["lightgbm>=4.0", "xgboost>=2.0"]
graph = ["torch>=2.1"]
llm = ["torch>=2.1", "transformers>=4.43", "peft>=0.10", "accelerate>=0.30", "sentence-transformers>=2.7", "faiss-cpu>=1.8", "huggingface-hub>=0.23"]
bench = ["vr-fraudnet-reproduction[trees,graph,llm]", "matplotlib>=3.7", "python-docx>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "jsonschema>=4.0", "ruff>=0.4"]

[project.scripts]
vrfraudnet = "vrfraudnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vrfraudnet = ["schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gpu: needs a CUDA device",
  "weights: needs licensed Llama weights on disk (never run in CI)",
]

[tool.coverage.run]
source = ["vrfraudnet"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = false
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py310"
