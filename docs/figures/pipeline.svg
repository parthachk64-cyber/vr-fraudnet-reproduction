<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 496" font-family="system-ui,sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#555"/></marker></defs>
<rect width="920" height="496" fill="#fbfbf8"/>
<text x="20" y="26" font-weight="600">VR-FraudNet inference path (generated from vrfraudnet.docs.STAGES)</text>
<rect x="20" y="44" width="250" height="54" rx="6" fill="#e8f1fb" stroke="#555"/>
<text x="32" y="66" font-weight="600">Stage 0: Time-conditioned spectral enco</text>
<text x="32" y="86" fill="#444">z_g [N,64]</text>
<text x="290" y="66" fill="#333">in:  x [N,F]; sparse L [N,N] (edges before t); t</text>
<text x="290" y="86" fill="#333">fit: train rows; graph snapshots strictly before the batch&#x27;s earliest time</text>
<line x1="145" y1="98" x2="145" y2="120" stroke="#555" marker-end="url(#a)"/>
<rect x="20" y="120" width="250" height="54" rx="6" fill="#e8f1fb" stroke="#555"/>
<text x="32" y="142" font-weight="600">Stage 1: LightGBM triage + threshold ga</text>
<text x="32" y="162" fill="#444">p_triage in [0,1]; route in {accept, r</text>
<text x="290" y="142" fill="#333">in:  [x, z_g]</text>
<text x="290" y="162" fill="#333">fit: train (early stopping on VAL_SELECT); thresholds on VAL_SELECT</text>
<line x1="145" y1="174" x2="145" y2="196" stroke="#555" marker-end="url(#a)"/>
<rect x="20" y="196" width="250" height="54" rx="6" fill="#fdf1e3" stroke="#555"/>
<text x="32" y="218" font-weight="600">Stage R: Retrieval (inside Stage 2)</text>
<text x="32" y="238" fill="#444">&lt;=4 verified TRAIN exemplars</text>
<text x="290" y="218" fill="#333">in:  summary of the review-band case</text>
<text x="290" y="238" fill="#333">fit: verified training exemplars only</text>
<line x1="145" y1="250" x2="145" y2="272" stroke="#555" marker-end="url(#a)"/>
<rect x="20" y="272" width="250" height="54" rx="6" fill="#fdf1e3" stroke="#555"/>
<text x="32" y="294" font-weight="600">Stage 2: Schema-constrained rationale m</text>
<text x="32" y="314" fill="#444">JSON: verdict, probability, &lt;=8 typed </text>
<text x="290" y="294" fill="#333">in:  evidence, p_triage, demonstrations</text>
<text x="290" y="314" fill="#333">fit: LoRA on verified review-band TRAIN targets</text>
<line x1="145" y1="326" x2="145" y2="348" stroke="#555" marker-end="url(#a)"/>
<rect x="20" y="348" width="250" height="54" rx="6" fill="#efe8f7" stroke="#555"/>
<text x="32" y="370" font-weight="600">Stage 3: Fixed deterministic verifier</text>
<text x="32" y="390" fill="#444">V in {0,1}; claim-level audit</text>
<text x="290" y="370" fill="#333">in:  rationale + trusted evidence snapshot</text>
<text x="290" y="390" fill="#333">fit: nothing: not trainable</text>
<line x1="145" y1="402" x2="145" y2="424" stroke="#555" marker-end="url(#a)"/>
<rect x="20" y="424" width="250" height="54" rx="6" fill="#e8f1fb" stroke="#555"/>
<text x="32" y="446" font-weight="600">Stage 4: Isotonic mixer + split-conform</text>
<text x="32" y="466" fill="#444">calibrated risk; prediction set</text>
<text x="290" y="446" fill="#333">in:  p_triage, eligible p_rationale, verifier state</text>
<text x="290" y="466" fill="#333">fit: mixer: VAL_SELECT; conformal: VAL_CALIBRATION (disjoint)</text>
</svg>