name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU, core + trees)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[trees,dev]"
      - name: Tests with coverage
        run: pytest -q --cov=vrfraudnet --cov-report=term-missing
      - name: Five-minute path
        run: |
          vrfraudnet demo
          vrfraudnet verify examples/rationale_accepted.json examples/evidence_wire.json
          vrfraudnet audit --out-dir "$RUNNER_TEMP/audit"
